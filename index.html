<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Electric Scooter AR</title>
<script type="module" src="https://cdn.jsdelivr.net/npm/@google/model-viewer@4.3.0/dist/model-viewer.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; font-family: system-ui, sans-serif; background: #111418; color: #fff; }
  [hidden] { display: none !important; }

  model-viewer { width: 100%; height: 100%; --poster-color: transparent; }
  button { font: inherit; color: inherit; border: 0; cursor: pointer; }

  .glass { background: rgba(15, 18, 24, .78); backdrop-filter: blur(10px); border-radius: 16px; pointer-events: auto; }

  /* Top title card */
  #header { position: absolute; top: calc(16px + env(safe-area-inset-top)); left: 16px; right: 72px; padding: 12px 16px; }
  #header h1 { font-size: 18px; }
  #header p { font-size: 13px; opacity: .7; }

  /* Bottom area: buttons + info panel */
  #bottom { position: absolute; left: 16px; right: 16px; bottom: calc(80px + env(safe-area-inset-bottom)); max-width: 460px; margin: 0 auto; display: flex; flex-direction: column; gap: 10px; pointer-events: none; }
  #panel { padding: 14px; }
  #bottom button { pointer-events: auto; }
  #tabs { display: flex; gap: 6px; margin-bottom: 10px; }
  .tab { flex: 1; padding: 8px; border-radius: 10px; background: rgba(255,255,255,.08); font-size: 13px; }
  .tab.active { background: #4f8cff; }
  #content { font-size: 14px; line-height: 1.5; max-height: 22vh; overflow-y: auto; }

  .row { display: flex; gap: 10px; }
  .action { flex: 1; padding: 12px; border-radius: 12px; background: rgba(15,18,24,.78); pointer-events: auto; }
  #ar-button { position: absolute; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom)); max-width: 460px; margin: 0 auto; height: 52px; z-index: 10; border-radius: 14px; background: #4f8cff; font-weight: 600; pointer-events: auto; }

  /* Hotspots */
  .hotspot { width: 28px; height: 28px; border-radius: 50%; background: #4f8cff; border: 2px solid #fff; font-size: 13px; font-weight: 700; pointer-events: auto; }
  .hotspot:not([data-visible]) { opacity: .25; }

  /* AR guidance message */
  #hint { position: absolute; top: 42%; left: 50%; transform: translate(-50%, -50%); padding: 12px 18px; font-size: 14px; text-align: center; width: max-content; max-width: 85%; display: none; }
  model-viewer[ar-status="session-started"] #hint,
  model-viewer[ar-tracking="not-tracking"] #hint { display: block; }

  /* Close button in AR */
  #exit-ar { position: absolute; top: calc(16px + env(safe-area-inset-top)); right: 16px; width: 46px; height: 46px; border-radius: 50%; background: rgba(15,18,24,.78); font-size: 20px; }

  #notice { padding: 10px 14px; font-size: 13px; text-align: center; }
</style>
</head>
<body>

<!-- 1. Keep scooter.glb in the same folder as this file -->
<model-viewer
  id="viewer"
  src="scooter.glb"
  alt="3D model of an electric scooter"
  camera-orbit="65deg 75deg auto"
  ar
  ar-modes="webxr scene-viewer quick-look"
  ar-placement="floor"
  ar-scale="auto"
  camera-controls
  auto-rotate
  touch-action="none"
  shadow-intensity="1"
  xr-environment>

  <button slot="ar-button" id="ar-button">View in your space</button>
  <button slot="exit-webxr-ar-button" id="exit-ar" aria-label="Exit AR">✕</button>

  <div id="header" class="glass">
    <h1 id="title"></h1>
    <p id="subtitle"></p>
  </div>

  <div id="hint" class="glass">Point at the floor, move slowly, then drag to position</div>

  <div id="bottom">
    <div id="notice" class="glass" hidden></div>
    <div id="panel" class="glass">
      <div id="tabs"></div>
      <div id="content"></div>
    </div>
    <div class="row">
      <button class="action" id="toggle-info">Hide info</button>
      <button class="action" id="toggle-spots">Hide points</button>
    </div>
  </div>
</model-viewer>

<script type="module">
  // ===== 2. EDIT YOUR INFO HERE =====
  const product = {
    title: "Electric Scooter",
    subtitle: "View it in your space",
    tabs: {
      Overview: "An electric scooter with a yellow body, black frame and wide tyres. Tap a number to explore its parts.",
      // Replace each "Add value" with your real figures
      Specs: "Top speed: Add value<br>Range: Add value<br>Motor: Add value<br>Battery: Add value<br>Weight: Add value",
      Features: "• Front headlight<br>• Handlebar display<br>• Rear suspension<br>• Flat standing deck<br>• Side kickstand"
    },
    // Positions in metres on this model:
    // x = side to side | y = height | z = back (-) to front (+)
    // normal = the direction the point faces
    hotspots: [
      { position: "0.135m 0.776m 0.238m",  normal: "1m 0m 0m", title: "Handlebar",       text: "Grips, brake levers and display." },
      { position: "-0.013m 0.441m 0.352m", normal: "0m 0m 1m", title: "Headlight",       text: "Front light mounted on the steering stem." },
      { position: "0.071m 0.131m 0.023m",  normal: "1m 0m 0m", title: "Deck",            text: "Flat standing area between the wheels." },
      { position: "0.052m 0.169m -0.183m", normal: "1m 0m 0m", title: "Rear suspension", text: "Spring shocks that soften bumps." },
      { position: "0.073m 0.13m -0.367m",  normal: "1m 0m 0m", title: "Rear wheel",      text: "Wide tyre with a mudguard above it." }
    ]
  };
  // ==================================

  const $ = (id) => document.getElementById(id);
  const viewer = $("viewer");
  const content = $("content");
  const panel = $("panel");

  $("title").textContent = product.title;
  $("subtitle").textContent = product.subtitle;

  // Tabs
  function showInfo(html, activeButton) {
    content.innerHTML = html;
    document.querySelectorAll(".tab").forEach(t => t.classList.toggle("active", t === activeButton));
    panel.hidden = false;
    $("toggle-info").textContent = "Hide info";
  }

  Object.entries(product.tabs).forEach(([name, html], i) => {
    const button = document.createElement("button");
    button.className = "tab";
    button.textContent = name;
    button.addEventListener("click", () => showInfo(html, button));
    $("tabs").appendChild(button);
    if (i === 0) showInfo(html, button);
  });

  // Hotspots
  const spots = product.hotspots.map((spot, i) => {
    const button = document.createElement("button");
    button.className = "hotspot";
    button.slot = `hotspot-${i}`;
    button.textContent = i + 1;
    button.setAttribute("aria-label", spot.title);
    button.dataset.visibilityAttribute = "visible";
    button.dataset.position = spot.position;
    button.dataset.normal = spot.normal;
    button.addEventListener("click", () => showInfo(`<strong>${spot.title}</strong><br>${spot.text}`));
    viewer.appendChild(button);
    return button;
  });

  // Show a message if this device cannot do AR
  viewer.addEventListener("load", () => {
    if (!viewer.canActivateAR) {
      $("notice").textContent = "AR is not available here. Open this page on a supported phone.";
      $("notice").hidden = false;
    }
  });

  viewer.addEventListener("error", () => {
    $("notice").textContent = "The 3D model could not load. Check the file name and path.";
    $("notice").hidden = false;
  });

  // Show / hide buttons
  $("toggle-info").addEventListener("click", (e) => {
    panel.hidden = !panel.hidden;
    e.target.textContent = panel.hidden ? "Show info" : "Hide info";
  });

  let spotsVisible = true;
  $("toggle-spots").addEventListener("click", (e) => {
    spotsVisible = !spotsVisible;
    spots.forEach(s => s.hidden = !spotsVisible);
    e.target.textContent = spotsVisible ? "Hide points" : "Show points";
  });

  // AR status messages
  viewer.addEventListener("ar-status", (e) => {
    const status = e.detail.status;
    if (status === "session-started") $("hint").textContent = "Point at the floor, move slowly, then drag to position";
    if (status === "failed") {
      $("notice").textContent = "AR could not start. Check camera permission and try again.";
      $("notice").hidden = false;
    }
  });

  viewer.addEventListener("ar-tracking", (e) => {
    $("hint").textContent = e.detail.status === "not-tracking"
      ? "Tracking lost. Aim at a well lit, textured surface"
      : "Point at the floor, move slowly, then drag to position";
  });

  // Stop taps on the UI from also moving the model
  document.querySelectorAll("#header, #bottom .glass, #bottom button, .hotspot, #exit-ar").forEach(el => {
    el.addEventListener("beforexrselect", e => e.preventDefault());
    el.addEventListener("pointerdown", e => e.stopPropagation());
  });
</script>
</body>
</html>
